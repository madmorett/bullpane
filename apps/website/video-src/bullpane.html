<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bullpane</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0d12; --bg-3: #171b24; --line: #232937;
    --fg: #e6e9f0; --muted: #9aa3b5; --subtle: #6b7488;
    --amber: #f5a524; --pro: #b48cff; --green: #3ecf8e;
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --serif: "Instrument Serif", Georgia, serif;
    --sans: "Inter", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  #stage {
    position: relative; width: 1600px; height: 900px; overflow: hidden; color: var(--fg); font-family: var(--sans);
    background: radial-gradient(1100px 700px at 85% -15%, rgba(91,141,239,.10), transparent 60%),
                radial-gradient(900px 600px at -10% 110%, rgba(245,165,36,.09), transparent 60%), var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .abs { position: absolute; }
  .center { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .kicker { font-family: var(--mono); font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); }
  .h1 { font-family: var(--display); font-weight: 700; font-size: 96px; line-height: 1.02; letter-spacing: -.03em; margin-top: 18px; }
  .h1 em, .h2 em { font-family: var(--serif); font-weight: 400; font-style: italic; color: var(--amber); letter-spacing: -.01em; }
  .sub { margin-top: 22px; font-size: 26px; color: var(--muted); max-width: 980px; line-height: 1.45; }
  .logo { display: inline-flex; align-items: center; gap: 14px; font-family: var(--display); font-weight: 700; font-size: 40px; }
  .logo-mark { width: 60px; height: 60px; border-radius: 14px; background: #0b0d10; box-shadow: 0 0 0 1px #353c48; display: grid; place-items: center; }
  .pro { font-family: var(--mono); font-size: 15px; letter-spacing: .1em; color: var(--pro); border: 1px solid rgba(180,140,255,.45); background: rgba(180,140,255,.1); padding: 4px 10px; border-radius: 999px; }
  .free { font-family: var(--mono); font-size: 15px; letter-spacing: .1em; color: var(--green); border: 1px solid rgba(62,207,142,.45); background: rgba(62,207,142,.1); padding: 4px 10px; border-radius: 999px; }

  /* feature scenes: copy on the left, the real screen on the right */
  .scene { inset: 0; }
  .copy { position: absolute; left: 80px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
  .num { font-family: var(--mono); font-size: 17px; letter-spacing: .12em; color: var(--amber); text-transform: uppercase; }
  .h2 { font-family: var(--display); font-weight: 700; font-size: 54px; line-height: 1.04; letter-spacing: -.025em; margin-top: 14px; }
  .p { font-size: 22px; color: var(--muted); line-height: 1.5; margin-top: 18px; }
  .frame { position: absolute; left: 600px; top: 90px; width: 940px; height: 720px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: #0d1015; box-shadow: 0 40px 100px rgba(0,0,0,.55); }
  .bar { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--line); background: #12151b; }
  .bar i { width: 10px; height: 10px; border-radius: 50%; background: #2b303b; display: inline-block; }
  .bar span { margin-left: 12px; font-family: var(--mono); font-size: 13px; color: var(--subtle); }
  .view { position: absolute; top: 40px; left: 0; right: 0; bottom: 0; overflow: hidden; }
  .view img { position: absolute; left: 0; top: 0; width: 100%; transform-origin: 0 0; }

  /* pro collage */
  .tiles { position: absolute; left: 600px; top: 90px; width: 940px; height: 720px; }
  .tile { position: absolute; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 30px 70px rgba(0,0,0,.5); background: #0d1015; }
  .tile img { width: 100%; display: block; }
  .tile .lbl { position: absolute; left: 12px; bottom: 12px; font-family: var(--mono); font-size: 14px; background: rgba(11,13,18,.85); border: 1px solid var(--line); padding: 4px 10px; border-radius: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
  .chip { font-size: 17px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-3); }
  .chip.mcp { border-color: rgba(245,165,36,.5); color: var(--amber); }
  .mcp-tile { position: absolute; display: flex; flex-direction: column; justify-content: center; padding: 26px; border-radius: 14px; border: 1px solid rgba(245,165,36,.45); background: linear-gradient(135deg, #1a1710, #12151b); box-shadow: 0 30px 70px rgba(0,0,0,.5); }
  .mcp-tile b { font-family: var(--display); font-size: 34px; letter-spacing: -.02em; }
  .mcp-tile span { margin-top: 8px; color: var(--muted); font-size: 17px; line-height: 1.45; }

  .term { margin-top: 34px; font-family: var(--mono); font-size: 26px; background: #0f1218; border: 1px solid var(--line); border-radius: 14px; padding: 22px 30px; text-align: left; min-width: 760px; }
  .term .pr { color: var(--green); }
  .term .cm { color: var(--subtle); }
  .caret { display: inline-block; width: 12px; height: 28px; background: var(--fg); vertical-align: -5px; margin-left: 2px; }
</style>
</head>
<body>
<div id="stage">
  <div id="s-title" class="abs center">
    <div class="kicker">Bullpane</div>
    <div class="h1">Every BullMQ queue.<br /><em>One</em> pane.</div>
    <div class="sub">A fast, self-hosted dashboard for BullMQ and BullMQ Pro. One container, next to the Redis your workers already use.</div>
  </div>
</div>

<script>
const DURATION = 33;
const stage = document.getElementById("stage");
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const out = (x) => 1 - Math.pow(1 - x, 3);
const win = (t, a, b, d = 0.5) => Math.min(out(p(t, a, a + d)), 1 - ease(p(t, b - d, b)));
const LOGO = '<svg viewBox="0 0 32 32" width="42" height="42"><rect x="7" y="8" width="18" height="4" rx="2" fill="#5b8def"/><rect x="7" y="14" width="13" height="4" rx="2" fill="#5b8def" opacity=".75"/><rect x="7" y="20" width="8" height="4" rx="2" fill="#5b8def" opacity=".5"/><circle cx="24" cy="22" r="3" fill="#f85149"/></svg>';

// Feature scenes. `cam` = [scale, x%, y%] at the start and the end of the scene:
// the camera eases between them (x/y are how far into the screenshot we look).
const FEATURES = [
  { id: "overview", a: 3.0, b: 7.6, num: "01 · Overview", h: "See every queue <em>at once</em>", p: "Counts, rates and the queues that need attention, across every Redis connection.", img: "../public/shots/overview.jpg", url: "/", cam: [[1.18, 0, 0], [1.3, 10, 40]] },
  { id: "failed", a: 7.4, b: 12.0, num: "02 · Failures", h: "Find the 381 <em>that failed</em>", p: "Search job data, names and errors server-side. Select them, retry or remove in bulk.", img: "../public/shots/queue-failed.jpg", url: "/c/prod/q/payments.webhook-dispatch?state=failed", cam: [[1, 0, 0], [1.08, 0, 55]] },
  { id: "job", a: 11.8, b: 15.8, num: "03 · One job", h: "Everything about <em>one</em> job", p: "Data, options, stack trace, logs, attempts and its flow parent.", img: "../public/shots/job.jpg", url: "/c/prod/q/payments/j/16951", cam: [[1.02, 0, 0], [1.12, 6, 30]] },
  { id: "metrics", a: 15.6, b: 19.4, num: "04 · Metrics", h: "Throughput and failures, <em>per minute</em>", p: "Read from BullMQ's own metrics. No agent, no exporter, nothing to install.", img: "../public/shots/metrics.jpg", url: "/c/prod/q/payments/metrics", cam: [[1, 0, 0], [1.1, 8, 20]] },
  { id: "groups", a: 19.2, b: 22.8, num: "05 · BullMQ Pro", h: "Groups and batches, <em>first class</em>", p: "Rate-limited, paused or maxed groups at a glance, read straight from the Pro keys.", img: "../public/shots/groups.jpg", url: "/c/prod/q/sms/groups", cam: [[1, 0, 0], [1.14, 10, 0]] },
];

for (const f of FEATURES) {
  const el = document.createElement("div");
  el.className = "abs scene";
  el.id = "s-" + f.id;
  el.innerHTML = `
    <div class="copy"><div class="num">${f.num}</div><div class="h2">${f.h}</div><div class="p">${f.p}</div></div>
    <div class="frame"><div class="bar"><i></i><i></i><i></i><span>bullpane.acme.com${f.url}</span></div><div class="view"><img src="${f.img}" /></div></div>`;
  stage.appendChild(el);
}

stage.insertAdjacentHTML("beforeend", `
  <div id="s-pro" class="abs scene">
    <div class="copy">
      <div class="num" style="color:var(--pro)">Pro · for the team</div>
      <div class="h2">Who can do what, <em>and who did</em></div>
      <div class="chips" id="pro-chips">
        <span class="chip">Users &amp; roles</span><span class="chip">SSO</span><span class="chip">Alerts</span><span class="chip">Audit log</span><span class="chip">Folders</span><span class="chip">Flows</span><span class="chip mcp">MCP</span>
      </div>
    </div>
    <div class="tiles">
      <div class="tile" id="tile-alerts" style="left:0;top:60px;width:460px"><img src="../public/shots/alerts.jpg" /><span class="lbl">alerts</span></div>
      <div class="tile" id="tile-users" style="left:0;top:266px;width:460px"><img src="../public/shots/users.jpg" /><span class="lbl">users &amp; roles</span></div>
      <div class="mcp-tile" id="tile-mcp" style="left:0;top:441px;width:460px;height:200px"><b>MCP</b><span>Your queues inside your AI, as you, within your role. Every write audited.</span></div>
      <div class="tile" id="tile-audit" style="left:480px;top:60px;width:460px"><img src="../public/shots/audit.jpg" /><span class="lbl">audit log</span></div>
      <div class="tile" id="tile-flows" style="left:480px;top:411px;width:460px"><img src="../public/shots/flows.jpg" /><span class="lbl">flows</span></div>
    </div>
  </div>
  <div id="s-free" class="abs center">
    <span class="free">FREE</span>
    <div class="h1" style="font-size:78px">Free, and <em>no login.</em></div>
    <div class="sub">Everything bull-board does, plus search in job data, bulk actions, metrics and BullMQ Pro groups. Unlimited connections and queues.</div>
    <div class="term"><div class="cm"># next to the Redis your workers already use</div><div><span class="pr">$</span> <span id="typed"></span><span class="caret" id="caret"></span></div></div>
  </div>
  <div id="s-end" class="abs center">
    <div class="logo"><span class="logo-mark">${LOGO}</span>Bullpane</div>
    <div class="h1" style="font-size:80px;margin-top:30px">Every BullMQ queue. <em>One</em> pane.</div>
    <div class="sub" style="font-family:var(--mono);font-size:22px">Free forever · Pro $39/month, one installation, unlimited users</div>
    <div class="sub" style="margin-top:30px;color:var(--fg);font-size:30px;font-family:var(--display);font-weight:600">bullpane.com</div>
  </div>`);

const $ = (id) => document.getElementById(id);
function show(el, o, dy = 0, extra = "") {
  el.style.opacity = o;
  el.style.transform = `translateY(${(1 - o) * dy}px) ${extra}`;
}
const CMD = "docker compose up -d";

window.renderAt = function (t) {
  show($("s-title"), win(t, 0, 3.3), 20);

  for (const f of FEATURES) {
    const el = $("s-" + f.id);
    const o = win(t, f.a, f.b);
    el.style.opacity = o;
    el.style.display = o > 0 ? "" : "none";
    if (o <= 0) continue;
    // copy slides up, the frame slides in from the right
    const k = out(p(t, f.a, f.a + 0.7));
    el.querySelector(".copy").style.transform = `translateY(${(1 - k) * 24}px)`;
    el.querySelector(".frame").style.transform = `translateX(${(1 - k) * 60}px)`;
    // the frame follows the screenshot's shape (capped), centred vertically
    const img = el.querySelector(".view img"), view = el.querySelector(".view"), frame = el.querySelector(".frame");
    const fh = Math.min(720, 40 + 940 * (img.naturalHeight / img.naturalWidth) * f.cam[0][0]);
    frame.style.height = fh + "px";
    frame.style.top = (900 - fh) / 2 + "px";
    // camera: ease from cam[0] to cam[1] over the scene
    const c = ease(p(t, f.a + 0.3, f.b));
    const [s0, x0, y0] = f.cam[0], [s1, x1, y1] = f.cam[1];
    const s = s0 + (s1 - s0) * c;
    const ih = img.naturalHeight * (view.clientWidth / img.naturalWidth) * s;
    const iw = view.clientWidth * s;
    const tx = -Math.max(0, iw - view.clientWidth) * ((x0 + (x1 - x0) * c) / 100);
    const ty = -Math.max(0, ih - view.clientHeight) * ((y0 + (y1 - y0) * c) / 100);
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  }

  const pro = win(t, 22.6, 27.0);
  $("s-pro").style.opacity = pro;
  $("s-pro").style.display = pro > 0 ? "" : "none";
  ["tile-alerts", "tile-audit", "tile-users", "tile-flows", "tile-mcp"].forEach((id, i) => {
    const k = out(p(t, 22.8 + i * 0.32, 23.5 + i * 0.32));
    $(id).style.opacity = k;
    $(id).style.transform = `translateY(${(1 - k) * 40}px) scale(${0.96 + 0.04 * k})`;
  });
  $("tile-mcp").style.boxShadow = t > 24.6 && t < 26.2 ? "0 0 0 2px rgba(245,165,36,.6), 0 30px 70px rgba(0,0,0,.5)" : "";
  [...$("pro-chips").children].forEach((c, i) => (c.style.opacity = out(p(t, 23.0 + i * 0.18, 23.4 + i * 0.18))));

  show($("s-free"), win(t, 26.8, 30.0), 20);
  const n = Math.floor(clamp((t - 27.6) * 16, 0, CMD.length));
  $("typed").textContent = CMD.slice(0, n);
  $("caret").style.opacity = Math.floor(t * 2) % 2 === 0 || n < CMD.length ? 1 : 0;

  show($("s-end"), out(p(t, 29.9, 30.6)), 20);
};

window.DURATION = DURATION;
const q = new URLSearchParams(location.search);
const imgs = [...document.images];
Promise.all([document.fonts.ready, ...imgs.map((i) => (i.complete ? null : new Promise((r) => (i.onload = i.onerror = r))))]).then(() => {
  window.ready = true;
  if (q.has("t")) window.renderAt(Number(q.get("t")));
  else {
    const t0 = performance.now();
    const loop = () => { window.renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  }
});
</script>
</body>
</html>
