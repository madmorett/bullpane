# bullpane.com — static site. No code, only assets.
name = "bullpane-website"
compatibility_date = "2025-06-01"
workers_dev = false

routes = [
  { pattern = "bullpane.com", custom_domain = true },
  { pattern = "www.bullpane.com", custom_domain = true }
]

[assets]
directory = "./public"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
