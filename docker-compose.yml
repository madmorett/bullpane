# BullMQ Visualizer — production-ish. Bring your own Redis: you add connections
# to your BullMQ Redis instances from the dashboard after first-run setup.
#
#   cp .env.example .env   # set SESSION_SECRET at least
#   docker compose up -d
#   open http://localhost:3000
#
# External MySQL instead of the bundled one: set DATABASE_URL in .env to your
# instance (mysql://user:pass@host:3306/db), delete the `mysql` service below
# and the `depends_on` block on `app`.
services:
  app:
    build:
      context: .
      target: runner
    image: bullmq-visualizer:local
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-mysql://bmv:bmv@mysql:3306/bmv}
      # Random 32+ char string; signs the session cookie. Do not ship the placeholder.
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Empty = free edition. Paste your Pro key here or in Settings → License.
      BMV_LICENSE_KEY: ${BMV_LICENSE_KEY:-}
      BMV_CHECKOUT_URL: ${BMV_CHECKOUT_URL:-https://bullmq-visualizer.dev/pro}
      BMV_QUEUE_DISCOVERY_TTL: ${BMV_QUEUE_DISCOVERY_TTL:-30}
      BMV_ALERTS_INTERVAL: ${BMV_ALERTS_INTERVAL:-15}
      BMV_AUDIT_RETENTION_DAYS: ${BMV_AUDIT_RETENTION_DAYS:-365}
      BMV_JOB_PREVIEW_BYTES: ${BMV_JOB_PREVIEW_BYTES:-2048}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --mysql-native-password=ON --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: bmv
      MYSQL_USER: bmv
      MYSQL_PASSWORD: bmv
      MYSQL_ROOT_PASSWORD: root
    ports:
      # Exposed so `pnpm dev` on the host can reach it; drop in production.
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  mysql-data:
