# Runs on every PR and every push to main. This is the gate CONTRIBUTING.md
# points at: "pnpm typecheck and pnpm test must pass before you open a PR".
name: CI
on:
  push:
    branches: [main]
  pull_request:
# A contributor who pushes twice in a row should not queue two full runs; the
# newest commit is the only one whose result matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # packages/pg-inspector runs against a real Postgres (BullMQ 6's Postgres
    # backend). Setting BULLPANE_TEST_PG_URL makes that suite fail instead of
    # skipping when the database is not there.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: bullpane
          POSTGRES_DB: bullpane
        ports: ["5440:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      BULLPANE_TEST_PG_URL: postgres://postgres:bullpane@127.0.0.1:5440/bullpane
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # packages/redis-inspector spawns a throwaway `redis-server` on :6399 for its tests.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server >/dev/null
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # typecheck does not catch a broken Vite build (missing asset, bad import
      # in a lazy chunk), and a broken build only shows up at release time.
      - run: pnpm build

  # End to end on BullMQ's Postgres backend: the real server, real workers and a
  # real browser (apps/smoke). The load phase is left to local runs before a
  # release: shared 2-core runners make throughput numbers noise.
  smoke-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: bullpane
          POSTGRES_DB: bullpane
        ports: ["5440:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      BULLPANE_SMOKE_PG_URL: postgres://postgres:bullpane@127.0.0.1:5440/bullpane
      SMOKE_SKIP: interference
      SMOKE_SCREENSHOTS: ${{ github.workspace }}/smoke-screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bullpane/smoke exec playwright install --with-deps chromium
      - run: pnpm smoke:postgres
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-screenshots

  # The Dockerfile is how nearly everyone actually runs Bullpane, so a PR that
  # breaks it must fail here rather than at publish time. Build only, no push.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          # The Dockerfile's last stage is `simulator`; `runner` is the dashboard.
          target: runner
          push: false
          # amd64 only: this is a smoke test, and multi-arch is the release job's job.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
