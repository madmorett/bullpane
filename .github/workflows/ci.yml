name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # packages/redis-inspector spawns a throwaway `redis-server` on :6399 for its tests.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server >/dev/null
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
