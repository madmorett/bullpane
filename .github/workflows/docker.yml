# Builds the Bullpane dashboard image (Dockerfile target `runner`) and pushes it
# to GitHub Container Registry and Docker Hub (bullpane/bullpane).
#   main            → :edge
#   tag v1.2.3      → :1.2.3, :1.2, :latest
# Docker Hub needs repository secrets DOCKERHUB_USERNAME (the `bullpane` org)
# and DOCKERHUB_TOKEN (an organization access token with write access).
#
# Manual run with `mirror_tag` (e.g. 0.5.1) builds nothing: it copies that
# existing ghcr release, all platforms, to Docker Hub as :<tag>, :<major.minor>
# and :latest. For releases made before Docker Hub was set up.
# Make the package public once (GitHub → Packages → bullpane → Package settings →
# Change visibility) so `docker pull` works without a token, as bullpane.com promises.
name: Docker image
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mirror_tag:
        description: "Copy this existing ghcr release (e.g. 0.5.1) to Docker Hub, including :latest"
        required: false
permissions:
  contents: read
  packages: write
# Two pushes in quick succession used to race on the shared build cache
# ("error writing layer blob: not_found"); one build at a time, newest wins.
concurrency:
  # A manual mirror run must not cancel the build of the push it follows.
  group: docker-image-${{ github.ref }}-${{ inputs.mirror_tag || 'build' }}
  cancel-in-progress: true
jobs:
  mirror:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mirror_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy the multi-platform manifest
        env:
          TAG: ${{ inputs.mirror_tag }}
        run: |
          MINOR="${TAG%.*}"
          docker buildx imagetools create \
            -t "bullpane/bullpane:${TAG}" -t "bullpane/bullpane:${MINOR}" -t bullpane/bullpane:latest \
            "ghcr.io/${{ github.repository_owner }}/bullpane:${TAG}"
          docker buildx imagetools inspect "bullpane/bullpane:${TAG}"

  image:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mirror_tag == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/bullpane
            docker.io/bullpane/bullpane
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Dockerfile's last stage is `simulator`; without this the published
          # image is the traffic generator instead of the dashboard.
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
